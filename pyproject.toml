[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uds_driver"
version = "0.0.1"
requires-python = ">= 3.7"
authors = [
  { name = "Andrew Topping", email = "atopps@umich.edu" },
]

description = "A driver to communicate to ECUs through a can and serial interface."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.md" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "black>=24.4.2,<25.0.0",
  "isort>=5.13.2,<6.0.0",
  "pylint>=3.2.2,<4.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-html>=4.1.1,<5.0.0",
  "pytest>=8.2.1,<9.0.0",
  "twine>=5.0.0,<6.0.0",
  "toml>=0.10.2,<0.11.0",
  "python-can>=4.5.0,<5.0.0",
  "can-isotp>=2.0.6,<3.0.0",
  "pyserial>=3.5,<4.0"
]

[tool.pytest.ini_options]
pythonpath = ['.']

[tool.pylint.logging]
logging-format-style = "new"

logging-modules = ["logging"]

[tool.pylint."messages control"]
disable = [
  "raw-checker-failed",
  "bad-inline-option",
  "locally-disabled",
  "file-ignored",
  "suppressed-message",
  "useless-suppression",
  "deprecated-pragma",
  "use-symbolic-message-instead",
  "use-implicit-booleaness-not-comparison-to-string",
  "use-implicit-booleaness-not-comparison-to-zero",
  "logging-not-lazy",
  "f-string-without-interpolation",
  "logging-fstring-interpolation",
]
